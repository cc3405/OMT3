<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f8fc"/><stop offset="1" stop-color="#e5edf6"/></linearGradient><linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9fbfd"/><stop offset="1" stop-color="#b9c8d7"/></linearGradient></defs>
<rect width="1400" height="900" fill="url(#bg)"/>
<text x="70" y="72" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#18324b">OMER 可乘坐车辆｜载人安全概念示意</text>
<text x="72" y="110" font-family="Arial,sans-serif" font-size="19" fill="#52677a">当前项目方向示意 · 非尺寸工程图 · 机械结构和电气接口待实测确认</text>
<rect x="55" y="145" width="850" height="520" rx="24" fill="#ffffff" stroke="#c9d6e2" stroke-width="2"/>
<text x="85" y="188" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#24445f">A. 车辆主体与乘坐者座椅（示意）</text>
<!-- wheels -->
<rect x="220" y="470" width="490" height="105" rx="20" fill="#33485a"/>
<rect x="245" y="488" width="440" height="65" rx="12" fill="#526b7e"/>
<circle cx="285" cy="576" r="42" fill="#172a39"/><circle cx="285" cy="576" r="20" fill="#9fb0bd"/>
<circle cx="640" cy="576" r="42" fill="#172a39"/><circle cx="640" cy="576" r="20" fill="#9fb0bd"/>
<!-- deck/frame -->
<rect x="250" y="420" width="430" height="42" rx="8" fill="#d8e1e9" stroke="#61798b" stroke-width="3"/>
<rect x="280" y="285" width="24" height="140" fill="#5c819b"/><rect x="620" y="285" width="24" height="140" fill="#5c819b"/>
<rect x="280" y="285" width="364" height="22" rx="4" fill="#5c819b"/>
<rect x="304" y="320" width="316" height="95" rx="8" fill="#eaf0f5" stroke="#93a8b9" stroke-width="2"/>
<text x="462" y="357" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#294b64">主体框架 / 挡板</text>
<text x="462" y="386" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#52677a">型材或轻质板材，尺寸待 CAD 校核</text>
<!-- seat concept; not a structural drawing -->
<rect x="390" y="260" width="170" height="24" rx="8" fill="#3b6f91" stroke="#24445f" stroke-width="3"/>
<rect x="405" y="205" width="28" height="62" rx="8" fill="#5c819b" stroke="#24445f" stroke-width="3"/>
<rect x="420" y="284" width="16" height="112" fill="#5c819b"/>
<rect x="535" y="284" width="16" height="112" fill="#5c819b"/>
<rect x="360" y="185" width="230" height="62" rx="12" fill="#edf5fa" stroke="#9bb8cb" stroke-width="2"/>
<text x="475" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#24445f">乘坐者座椅</text>
<text x="475" y="233" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#52677a">位置示意，未做承载校核</text>
<!-- electronics -->
<rect x="490" y="435" width="110" height="28" rx="5" fill="#3b8a76"/><text x="545" y="454" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#fff">ESP32-S3</text>
<rect x="340" y="435" width="105" height="28" rx="5" fill="#557fa3"/><text x="392" y="454" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#fff">驱动/供电</text>
<!-- annotations -->
<text x="85" y="620" font-family="Arial,sans-serif" font-size="16" fill="#52677a">座椅、车架、轮组、转向、制动和重心均需工程设计与验证；本图不可用于加工。</text>
<rect x="940" y="145" width="405" height="520" rx="24" fill="#ffffff" stroke="#c9d6e2" stroke-width="2"/>
<text x="970" y="188" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#24445f">B. 关键设计边界</text>
<circle cx="980" cy="235" r="6" fill="#3b8a76"/><text x="1000" y="242" font-family="Arial,sans-serif" font-size="18" fill="#294b64">ESP32-S3 作为控制器</text>
<circle cx="980" cy="285" r="6" fill="#3b8a76"/><text x="1000" y="292" font-family="Arial,sans-serif" font-size="18" fill="#294b64">取消机械臂，优先载人结构</text>
<circle cx="980" cy="335" r="6" fill="#c17b23"/><text x="1000" y="342" font-family="Arial,sans-serif" font-size="18" fill="#294b64">座椅必须固定在主承载车架</text>
<circle cx="980" cy="385" r="6" fill="#b94c4c"/><text x="1000" y="392" font-family="Arial,sans-serif" font-size="18" fill="#294b64">独立卸载装置不得连接车辆</text>
<rect x="970" y="435" width="345" height="165" rx="14" fill="#fff4f1" stroke="#e8b6ae" stroke-width="2"/>
<text x="990" y="470" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#923d35">独立卸载装置（另行制作）</text>
<rect x="1010" y="495" width="260" height="55" rx="8" fill="#f3d4ce" stroke="#b96c61" stroke-width="2"/>
<path d="M1030 550 L1030 570 M1250 550 L1250 570" stroke="#b96c61" stroke-width="5"/><text x="1140" y="528" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#923d35">与车辆完全分离</text>
<text x="990" y="585" font-family="Arial,sans-serif" font-size="14" fill="#923d35">示意图，不代表已完成或通过测试</text>
<rect x="55" y="700" width="1290" height="140" rx="20" fill="#18324b"/>
<text x="85" y="745" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#ffffff">后续工程化步骤</text>
<text x="85" y="785" font-family="Arial,sans-serif" font-size="18" fill="#e4edf5">1. 冻结载人需求/总质量  →  2. 设计车架/座椅/轮组  →  3. 校核转向与制动  →  4. 配重验证与专业放行</text>
<text x="85" y="815" font-family="Arial,sans-serif" font-size="15" fill="#bdcddd">此 SVG 为概念示意图，不是工程图；未完成专业审查和配重验证前严禁载人。</text>
</svg>